[build]
# Use all available cores for compilation
jobs = 8

# Windows MSVC: reserve an 8 MiB stack in the PE header. The clap-derive CLI
# parser has very large stack frames in debug builds; without this (or the
# 64 MiB stack thread in suture-cli's main.rs) debug builds overflow the
# default 1 MiB main-thread stack.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-args=/STACK:8388608"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-args=-Wl,--stack,8388608"]

[target.x86_64-unknown-linux-gnu]
# Use system linker (faster than rust-lld for large workspaces)
linker = "gcc"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
